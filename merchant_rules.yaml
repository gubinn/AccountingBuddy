# 商户别名 → 分类规则（支持一级/二级路径）
#
# 匹配方式：先清洗商户名（去掉支付渠道前缀、公司后缀、快捷支付等），
# 再按 pattern 长度从长到短做包含匹配。
# category 可以写一级（餐饮）或二级路径（餐饮/外卖）。
# 分类器会优先采用二级分类；一级规则作为兜底。

normalize:
  prefixes:
    - "支付宝-支付宝-消费-"
    - "支付宝-消费-"
    - "支付宝-"
    - "财付通-微信支付-"
    - "财付通-"
    - "微信支付-"
    - "银联-"
    - "Apple Pay, 线上支付消费，"
    - "Apple Pay"

