# 商户别名 → 分类规则
#
# 匹配方式：先清洗商户名（去掉支付渠道前缀、公司后缀、快捷支付等），
# 再按 pattern 长度从长到短做包含匹配。pattern 越具体越好。
# category 必须与 config.yaml 的 category_mapping 中的分类名一致。

normalize:
  prefixes:
    - "支付宝-支付宝-消费-"
    - "支付宝-消费-"
    - "支付宝-"
    - "财付通-微信支付-"
    - "财付通-"
    - "微信支付-"
    - "银联-"
    - "Apple Pay, 线上支付消费，"
    - "Apple Pay"

